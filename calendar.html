<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pristine Kosher — Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --teal:#20A59F; --teal-dark:#178079; --teal-soft:#E3F4F2;
    --ink:#0A0A0A; --paper:#FFFFFF; --mist:#F4F6F5;
    --line:#E4E8E7; --muted:#5C6663; --orange:#F78700; --red:#D64545;
    --green:#2FA84F; --amber:#E8A400; --blue:#3B7DD8; --purple:#8659C4;
    --card:#FFFFFF; --card-hover:#F0FAF9; --radius:12px;
    --shadow:0 1px 2px rgba(10,10,10,.04),0 8px 24px rgba(10,10,10,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --teal:#2FBDB6; --teal-dark:#20A59F; --teal-soft:#123330;
      --ink:#F2F5F4; --paper:#0E1413; --mist:#0A0F0E;
      --line:#243230; --muted:#9AA7A4; --orange:#FF9D2E; --red:#F26D6D;
      --green:#4FC26B; --amber:#F0BE3C; --blue:#6AA3F0; --purple:#A582D9;
      --card:#141C1A; --card-hover:#182421;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"]{--teal:#20A59F;--teal-dark:#178079;--teal-soft:#E3F4F2;--ink:#0A0A0A;--paper:#FFFFFF;--mist:#F4F6F5;--line:#E4E8E7;--muted:#5C6663;--green:#2FA84F;--amber:#E8A400;--blue:#3B7DD8;--purple:#8659C4;--card:#FFFFFF;--card-hover:#F0FAF9}
  :root[data-theme="dark"]{--teal:#2FBDB6;--teal-dark:#20A59F;--teal-soft:#123330;--ink:#F2F5F4;--paper:#0E1413;--mist:#0A0F0E;--line:#243230;--muted:#9AA7A4;--green:#4FC26B;--amber:#F0BE3C;--blue:#6AA3F0;--purple:#A582D9;--card:#141C1A;--card-hover:#182421}

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--mist);color:var(--ink);font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}

  .top{display:flex;align-items:center;gap:14px;padding:16px 28px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:10}
  .top .mark{width:32px;height:32px;flex:none}
  .top .name{font-weight:800;letter-spacing:.12em;font-size:13px}
  .top .name span{color:var(--teal);font-weight:600}
  .top .crumb{margin-left:6px;padding-left:16px;border-left:1px solid #2a3432;font-size:13px;color:#9aa7a4}
  .top .links{margin-left:auto;display:flex;gap:14px;font-size:13px}
  .top .links a{color:#9aa7a4;text-decoration:none}
  .top .links a:hover{color:#fff}
  .top .themebtn{background:none;border:1px solid #2a3432;color:#9aa7a4;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px}
  .top .themebtn:hover{border-color:var(--teal);color:var(--teal)}

  .page{max-width:1200px;margin:0 auto;padding:22px 28px 60px}

  /* control bar */
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .viewtabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
  .viewtabs button{font-family:inherit;font-size:13.5px;font-weight:600;border:none;background:none;color:var(--muted);padding:7px 16px;border-radius:7px;cursor:pointer}
  .viewtabs button.on{background:var(--teal);color:#fff}
  .nav{display:flex;align-items:center;gap:8px}
  .nav button{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:9px;cursor:pointer;font-size:16px;color:var(--ink);font-family:inherit}
  .nav button:hover{border-color:var(--teal);color:var(--teal)}
  .nav .today{width:auto;padding:0 14px;font-size:13px;font-weight:600}
  .period{font-size:18px;font-weight:800;min-width:200px}
  .filters{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
  .filters select{font-family:inherit;font-size:13.5px;padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:inherit;cursor:pointer}
  .filters select:focus{outline:none;border-color:var(--teal)}

  .count-note{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .count-note b{color:var(--ink)}

  /* MONTH grid */
  .monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow)}
  .dow{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:6px 0;text-transform:uppercase}
  .mcell{min-height:96px;border:1px solid var(--line);border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:3px;background:var(--paper)}
  .mcell.pad{background:var(--mist);border-color:transparent}
  .mcell .dn{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
  .mcell.today .dn{background:var(--teal);color:#fff;width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
  .mjob{font-size:10.5px;padding:2px 5px;border-radius:5px;background:var(--teal-soft);color:var(--teal-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:2px solid var(--teal)}
  .mjob.exact{border-left-color:var(--orange)}
  .mmore{font-size:10px;color:var(--muted);cursor:pointer}

  /* WEEK view */
  .weekgrid{display:grid;grid-template-columns:56px repeat(7,1fr);gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .weekgrid .corner{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  .whead{text-align:center;padding:8px 4px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:12px}
  .whead .wd{font-weight:700}.whead .wn{color:var(--muted);font-size:11px}
  .whead.today .wn{color:var(--teal);font-weight:700}
  .whour{font-size:10.5px;color:var(--muted);text-align:right;padding:4px 6px 0 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .wslot{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:36px;padding:2px}
  .wjob{font-size:10px;padding:2px 4px;border-radius:4px;background:var(--teal-soft);color:var(--teal-dark);cursor:pointer;margin-bottom:2px;border-left:2px solid var(--teal);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wjob.exact{border-left-color:var(--orange)}

  /* DAY view */
  .daywrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .dayrow{display:grid;grid-template-columns:70px 1fr;border-bottom:1px solid var(--line)}
  .dayrow:last-child{border-bottom:none}
  .dhour{padding:10px 12px;font-size:12px;color:var(--muted);border-right:1px solid var(--line);font-variant-numeric:tabular-nums;text-align:right}
  .dslot{padding:6px;display:flex;flex-direction:column;gap:5px;min-height:44px}
  .djob{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--teal);cursor:pointer;transition:background .1s}
  .djob:hover{background:var(--card-hover)}
  .djob.exact{border-left-color:var(--orange)}
  .djob .jt{font-weight:600;font-size:14px}
  .djob .jm{font-size:12.5px;color:var(--muted)}
  .djob .jright{margin-left:auto;text-align:right}
  .djob .jest{font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
  .flexbadge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:99px;background:var(--teal-soft);color:var(--teal-dark)}
  .flexbadge.exact{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}

  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  .lbar{width:14px;height:3px;border-radius:2px}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(10,10,10,.5);display:none;z-index:20}
  .scrim.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--paper);box-shadow:-10px 0 40px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);z-index:21;padding:22px;overflow-y:auto}
  .drawer.open{transform:none}
  @media (prefers-reduced-motion:reduce){.drawer{transition:none}}
  .drawer h2{margin:0 0 2px;font-size:19px}
  .drawer .dm{color:var(--muted);font-size:13px;margin-bottom:16px}
  .drow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .drow .k{color:var(--muted)}.drow .v{font-weight:600;text-align:right}
  .dx{position:absolute;top:18px;right:18px;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer}

  @media (max-width:880px){
    .weekgrid{font-size:10px}
    .filters{width:100%;margin-left:0}
    .period{min-width:auto}
    .top .links{display:none}
  }
  @media (max-width:620px){
    .page{padding:16px}.top{padding:14px 18px}
    .weekgrid,.monthgrid{overflow-x:auto}
    .bar{gap:8px}
  }
</style>
</head>
<body>

<div class="top">
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <rect x="8" y="14" width="40" height="72" fill="#fff"/>
    <path d="M20 30 h14 a13 13 0 0 1 0 26 h-14 z" fill="#0A0A0A"/>
    <rect x="20" y="30" width="6" height="26" fill="#0A0A0A"/>
    <path d="M50 14 h22 L46 50 L72 86 H50 L28 52 z" fill="#20A59F"/>
  </svg>
  <div class="name">PRISTINE <span>KOSHER</span></div>
  <div class="crumb">Calendar</div>
  <div class="links"><a href="dashboard.html">Dashboard</a><a href="index.html">Booking</a></div>
  <button class="themebtn" id="theme" title="Switch light / dark" aria-label="Switch theme">◑</button>
</div>

<div class="page">
  <div class="bar">
    <div class="viewtabs" id="viewtabs">
      <button data-v="day">Day</button>
      <button data-v="week">Week</button>
      <button data-v="month" class="on">Month</button>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Previous">‹</button>
      <button class="today" id="todayBtn">Today</button>
      <button id="next" aria-label="Next">›</button>
    </div>
    <div class="period" id="period">—</div>
    <div class="filters">
      <select id="fMarket"><option value="">All markets</option></select>
      <select id="fWorker"><option value="">All workers (unassigned shown)</option></select>
    </div>
  </div>

  <div class="count-note" id="countNote"></div>
  <div id="viewArea"></div>

  <div class="legend">
    <span><i class="lbar" style="background:var(--teal)"></i> Flexible time (±1 hr)</span>
    <span><i class="lbar" style="background:var(--orange)"></i> Exact time (locked)</span>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Booking details"></aside>

<script>
/* ---------------- Supabase ---------------- */
const SUPABASE_URL = 'https://qkgdobpazyoxesyiznus.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cjaMPpEPhe-HxUd616SSRg_ShraAso2';

let bookings = [];
let workers = [];
let view = 'month';
let cursor = new Date(2027,3,14); // start near the season so seed data is visible
let fMarket = '', fWorker = '';

const $ = s => document.querySelector(s);
const esc = x => (x||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYMD = s => { const [y,m,dd]=s.split('-').map(Number); return new Date(y,m-1,dd); };
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function fmt12(t){ if(!t) return ''; let [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; let hh=h%12||12; return `${hh}:${pad(m)} ${ap}`; }
function serviceLabel(b){
  if(b.base==='sinks') return `Sinks only · ${b.sink_count||'?'} sink${b.sink_count>1?'s':''}`;
  return `Counters · ${b.size?b.size[0].toUpperCase()+b.size.slice(1):'—'}`;
}

/* ---------------- Load data ---------------- */
async function load(){
  try{
    const [bRes,wRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/bookings?select=*&order=service_date.asc`, {headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}}),
      fetch(`${SUPABASE_URL}/rest/v1/workers?select=id,name&order=name.asc`, {headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}})
    ]);
    bookings = bRes.ok ? await bRes.json() : [];
    workers = wRes.ok ? await wRes.json() : [];
    buildFilters();
    render();
  }catch(err){ console.error(err); $('#viewArea').innerHTML='<div class="empty">Could not load bookings.</div>'; }
}

function buildFilters(){
  const markets=[...new Set(bookings.map(b=>b.market).filter(Boolean))].sort();
  $('#fMarket').innerHTML = '<option value="">All markets</option>'+markets.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  $('#fWorker').innerHTML = '<option value="">All workers</option><option value="__unassigned">Unassigned only</option>'
    + workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('');
}

/* ---------------- Filtering ---------------- */
function visible(){
  return bookings.filter(b=>{
    if(!b.service_date) return false;
    if(fMarket && b.market!==fMarket) return false;
    if(fWorker==='__unassigned' && b.assigned_worker_id) return false;
    if(fWorker && fWorker!=='__unassigned' && b.assigned_worker_id!==fWorker) return false;
    return true;
  });
}

/* ---------------- Render dispatcher ---------------- */
function render(){
  document.querySelectorAll('#viewtabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(view==='month') renderMonth();
  else if(view==='week') renderWeek();
  else renderDay();
  const v=visible().length, total=bookings.filter(b=>b.service_date).length;
  // base line
  let note = `Showing <b>${v}</b> of ${total} scheduled jobs${fMarket?` in ${esc(fMarket)}`:''}.`;
  // when filtered to a specific worker, add a schedule summary
  if(fWorker && fWorker!=='__unassigned'){
    const w = workers.find(x=>x.id===fWorker);
    const theirs = visible();
    const days = [...new Set(theirs.map(j=>j.service_date))].sort();
    const revenue = theirs.reduce((s,j)=>s+(j.estimate||0),0);
    note = `<b>${esc(w?w.name:'Worker')}</b>’s schedule — <b>${theirs.length}</b> job${theirs.length===1?'':'s'} across <b>${days.length}</b> day${days.length===1?'':'s'} · $${revenue} total.`;
  } else if(fWorker==='__unassigned'){
    note = `<b>${v}</b> unassigned job${v===1?'':'s'}${fMarket?` in ${esc(fMarket)}`:''} — need a worker.`;
  }
  $('#countNote').innerHTML = note;
}

/* ---------------- MONTH ---------------- */
function renderMonth(){
  const y=cursor.getFullYear(), m=cursor.getMonth();
  $('#period').textContent = `${MONTHS[m]} ${y}`;
  const first=new Date(y,m,1), startPad=first.getDay(), days=new Date(y,m+1,0).getDate();
  const byDay={}; visible().forEach(b=>{ (byDay[b.service_date]=byDay[b.service_date]||[]).push(b); });
  let html='<div class="monthgrid">'+DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<startPad;i++) html+='<div class="mcell pad"></div>';
  const todayStr=ymd(new Date());
  for(let d=1;d<=days;d++){
    const key=ymd(new Date(y,m,d));
    const jobs=(byDay[key]||[]).sort((a,b)=>(a.time_slot||'').localeCompare(b.time_slot||''));
    html+=`<div class="mcell ${key===todayStr?'today':''}"><div class="dn">${d}</div>`;
    jobs.slice(0,3).forEach(b=>html+=`<div class="mjob ${b.flexibility==='exact'?'exact':''}" data-id="${b.id}">${fmt12(b.time_slot)} ${esc(b.customer_name)}</div>`);
    if(jobs.length>3) html+=`<div class="mmore" data-day="${key}">+${jobs.length-3} more</div>`;
    html+='</div>';
  }
  html+='</div>';
  $('#viewArea').innerHTML=html;
  bindJobs();
  $('#viewArea').querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',()=>{ cursor=parseYMD(el.dataset.day); view='day'; render(); }));
}

/* ---------------- WEEK ---------------- */
function renderWeek(){
  const start=new Date(cursor); start.setDate(start.getDate()-start.getDay());
  const end=new Date(start); end.setDate(end.getDate()+6);
  $('#period').textContent = `${MONTHS[start.getMonth()].slice(0,3)} ${start.getDate()} – ${MONTHS[end.getMonth()].slice(0,3)} ${end.getDate()}`;
  const todayStr=ymd(new Date());
  const days=[...Array(7)].map((_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d;});
  const byCell={}; visible().forEach(b=>{ const h=(b.time_slot||'08:00').split(':')[0]; byCell[`${b.service_date}_${h}`]=byCell[`${b.service_date}_${h}`]||[]; byCell[`${b.service_date}_${h}`].push(b); });
  let html='<div class="weekgrid"><div class="corner"></div>';
  days.forEach(d=>html+=`<div class="whead ${ymd(d)===todayStr?'today':''}"><div class="wd">${DOW[d.getDay()]}</div><div class="wn">${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}</div></div>`);
  for(let h=8;h<=22;h++){
    html+=`<div class="whour">${fmt12(pad(h)+':00')}</div>`;
    days.forEach(d=>{
      const jobs=(byCell[`${ymd(d)}_${pad(h)}`]||[]);
      html+='<div class="wslot">'+jobs.map(b=>`<div class="wjob ${b.flexibility==='exact'?'exact':''}" data-id="${b.id}">${esc(b.customer_name)}</div>`).join('')+'</div>';
    });
  }
  html+='</div>';
  $('#viewArea').innerHTML=html; bindJobs();
}

/* ---------------- DAY ---------------- */
function renderDay(){
  $('#period').textContent = `${DOW[cursor.getDay()]}, ${MONTHS[cursor.getMonth()]} ${cursor.getDate()}`;
  const key=ymd(cursor);
  const jobs=visible().filter(b=>b.service_date===key).sort((a,b)=>(a.time_slot||'').localeCompare(b.time_slot||''));
  if(!jobs.length){ $('#viewArea').innerHTML='<div class="daywrap"><div class="empty">No jobs scheduled for this day.<br><span style="font-size:12.5px">Use ‹ › to move dates, or jump to the Pesach season (mid-April 2027).</span></div></div>'; return; }
  const byHour={}; jobs.forEach(b=>{ const h=(b.time_slot||'08:00').split(':')[0]; (byHour[h]=byHour[h]||[]).push(b); });
  let html='<div class="daywrap">';
  for(let h=8;h<=22;h++){
    const list=byHour[pad(h)]||[];
    if(!list.length) continue;
    html+=`<div class="dayrow"><div class="dhour">${fmt12(pad(h)+':00')}</div><div class="dslot">`;
    list.forEach(b=>{
      html+=`<div class="djob ${b.flexibility==='exact'?'exact':''}" data-id="${b.id}">
        <div><div class="jt">${fmt12(b.time_slot)} · ${esc(b.customer_name)}</div>
        <div class="jm">${esc(b.market)} · ${serviceLabel(b)}</div></div>
        <div class="jright"><div class="jest">$${b.estimate||0}</div>
        <span class="flexbadge ${b.flexibility==='exact'?'exact':''}">${b.flexibility==='exact'?'Exact':'±1 hr'}</span></div>
      </div>`;
    });
    html+='</div></div>';
  }
  html+='</div>';
  $('#viewArea').innerHTML=html; bindJobs();
}

/* ---------------- Job drawer ---------------- */
function bindJobs(){
  $('#viewArea').querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>openJob(el.dataset.id)));
}
function openJob(id){
  const b=bookings.find(x=>x.id===id); if(!b) return;
  const worker = b.assigned_worker_id ? (workers.find(w=>w.id===b.assigned_worker_id)||{}).name : null;
  $('#drawer').innerHTML=`<button class="dx" onclick="closeD()" aria-label="Close">✕</button>
    <h2>${esc(b.customer_name)}</h2><div class="dm">${esc(b.market)}</div>
    <div class="drow"><span class="k">Date</span><span class="v">${b.service_date}</span></div>
    <div class="drow"><span class="k">Time</span><span class="v">${fmt12(b.time_slot)} ${b.flexibility==='exact'?'(exact)':'(±1 hr)'}</span></div>
    <div class="drow"><span class="k">Service</span><span class="v">${serviceLabel(b)}</span></div>
    <div class="drow"><span class="k">Estimate</span><span class="v">$${b.estimate||0}</span></div>
    <div class="drow"><span class="k">Status</span><span class="v">${esc(b.status||'new')}</span></div>
    <div class="drow"><span class="k">Assigned worker</span><span class="v">${worker?esc(worker):'— none yet —'}</span></div>
    <div class="drow"><span class="k">Phone</span><span class="v">${esc(b.phone||'')}</span></div>
    <div class="drow"><span class="k">Address</span><span class="v">${esc(b.address||'')}</span></div>`;
  $('#scrim').classList.add('open'); $('#drawer').classList.add('open');
}
window.closeD=()=>{ $('#scrim').classList.remove('open'); $('#drawer').classList.remove('open'); };
$('#scrim').addEventListener('click',closeD);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeD(); });

/* ---------------- Controls ---------------- */
$('#viewtabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ view=b.dataset.v; render(); }));
$('#prev').addEventListener('click',()=>{ shift(-1); });
$('#next').addEventListener('click',()=>{ shift(1); });
$('#todayBtn').addEventListener('click',()=>{ cursor=new Date(); render(); });
function shift(dir){
  if(view==='month') cursor.setMonth(cursor.getMonth()+dir);
  else if(view==='week') cursor.setDate(cursor.getDate()+7*dir);
  else cursor.setDate(cursor.getDate()+dir);
  cursor=new Date(cursor); render();
}
$('#fMarket').addEventListener('change',e=>{ fMarket=e.target.value; render(); });
$('#fWorker').addEventListener('change',e=>{ fWorker=e.target.value; render(); });

$('#theme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sysDark?'light':'dark'));
});

load();
</script>
</body>
</html>
