<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pristine Kosher — Operations Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --teal:#20A59F; --teal-dark:#178079; --teal-soft:#E3F4F2;
    --ink:#0A0A0A; --paper:#FFFFFF; --mist:#F4F6F5;
    --line:#E4E8E7; --muted:#5C6663; --orange:#F78700; --red:#D64545;
    --green:#2FA84F; --amber:#E8A400; --blue:#3B7DD8;
    --card:#FFFFFF; --card-hover:#F0FAF9; --radius:14px;
    --shadow:0 1px 2px rgba(10,10,10,.04),0 8px 24px rgba(10,10,10,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --teal:#2FBDB6; --teal-dark:#20A59F; --teal-soft:#123330;
      --ink:#F2F5F4; --paper:#0E1413; --mist:#0A0F0E;
      --line:#243230; --muted:#9AA7A4; --orange:#FF9D2E; --red:#F26D6D;
      --green:#4FC26B; --amber:#F0BE3C; --blue:#6AA3F0;
      --card:#141C1A; --card-hover:#182421;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"]{--teal:#20A59F;--teal-dark:#178079;--teal-soft:#E3F4F2;--ink:#0A0A0A;--paper:#FFFFFF;--mist:#F4F6F5;--line:#E4E8E7;--muted:#5C6663;--green:#2FA84F;--amber:#E8A400;--blue:#3B7DD8;--red:#D64545;--card:#FFFFFF;--card-hover:#F0FAF9}
  :root[data-theme="dark"]{--teal:#2FBDB6;--teal-dark:#20A59F;--teal-soft:#123330;--ink:#F2F5F4;--paper:#0E1413;--mist:#0A0F0E;--line:#243230;--muted:#9AA7A4;--green:#4FC26B;--amber:#F0BE3C;--blue:#6AA3F0;--red:#F26D6D;--card:#141C1A;--card-hover:#182421}

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--mist);color:var(--ink);font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}

  .top{display:flex;align-items:center;gap:14px;padding:16px 28px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:10}
  .top .mark{width:32px;height:32px;flex:none}
  .top .name{font-weight:800;letter-spacing:.12em;font-size:13px}
  .top .name span{color:var(--teal);font-weight:600}
  .top .crumb{margin-left:6px;padding-left:16px;border-left:1px solid #2a3432;font-size:13px;color:#9aa7a4}
  .top .navlinks{margin-left:auto;display:flex;gap:16px;font-size:13px}
  .top .navlinks a{color:#9aa7a4;text-decoration:none;transition:color .12s}
  .top .navlinks a:hover{color:#fff}
  .top .themebtn{background:none;border:1px solid #2a3432;color:#9aa7a4;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px}
  @media (max-width:720px){ .top .navlinks{display:none} }
  .top .themebtn:hover{border-color:var(--teal);color:var(--teal)}

  .page{max-width:1120px;margin:0 auto;padding:24px 28px 60px}
  h1.ph{font-size:24px;font-weight:800;margin:0 0 18px}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:26px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;position:relative}
  .tile .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .tile .l{font-size:12px;color:var(--muted);margin-top:5px}
  .tile.alert{border-color:var(--orange)}
  .tile.alert .n{color:var(--orange)}
  .tile .stripe{position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:99px;background:var(--teal)}
  .tile.alert .stripe{background:var(--orange)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .phead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .phead h2{font-size:16px;font-weight:800;margin:0}
  .phead .count{font-size:12px;color:var(--muted);background:var(--mist);border-radius:99px;padding:2px 9px;font-weight:600}
  .filters{margin-left:auto;display:flex;gap:4px}
  .filters button{font-family:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
  .filters button.on{background:var(--teal);border-color:var(--teal);color:#fff}

  .rows{max-height:560px;overflow-y:auto}
  .row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--card-hover)}
  .ravatar{width:38px;height:38px;border-radius:10px;background:var(--teal-soft);color:var(--teal-dark);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .ravatar.app{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
  .rmain{flex:1;min-width:0}
  .rtitle{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rsub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rright{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .ramt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
  .pill.new{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
  .pill.needs{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
  .pill.review{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
  .pill.confirmed,.pill.approved{background:var(--teal-soft);color:var(--teal-dark)}
  .pill.declined{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
  .pill.pending{background:var(--mist);color:var(--muted)}
  .attn{width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(10,10,10,.5);display:none;z-index:20}
  .scrim.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper);box-shadow:-10px 0 40px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);z-index:21;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  @media (prefers-reduced-motion:reduce){.drawer{transition:none}}
  .dhead{display:flex;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
  .dhead .ravatar{width:44px;height:44px;font-size:15px}
  .dhead h2{font-size:17px;font-weight:800;margin:0}
  .dhead .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .dhead .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
  .dbody{padding:18px 22px;overflow-y:auto;flex:1}
  .drow{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .drow:last-child{border-bottom:none}
  .drow .k{color:var(--muted)}
  .drow .v{font-weight:600;text-align:right}
  .dsec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:18px 0 4px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
  .chip2{font-size:11.5px;background:var(--mist);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
  .dfoot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
  .btn{font-family:inherit;font-weight:700;font-size:14px;border-radius:11px;cursor:pointer;padding:12px 18px;border:1.5px solid transparent;flex:1;transition:background .15s,border-color .15s,opacity .15s}
  .btn.approve{background:var(--teal);color:#fff}
  .btn.approve:hover{background:var(--teal-dark)}
  .btn.decline{background:none;color:var(--red);border-color:var(--line)}
  .btn.decline:hover{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}
  .btn.secondary{background:none;color:var(--muted);border-color:var(--line)}
  .btn.secondary:hover{border-color:var(--muted);color:var(--ink)}
  .resolved{padding:14px 22px;background:var(--teal-soft);color:var(--teal-dark);font-size:13.5px;font-weight:600;text-align:center}
  .resolved.no{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}

  @media (max-width:820px){
    .tiles{grid-template-columns:1fr 1fr}
    .cols{grid-template-columns:1fr}
    .page{padding:18px}.top{padding:14px 18px}
  }

  /* scheduler / assignment UI */
  .sug-hint{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .wsug{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:var(--card)}
  .wsug.best{border-color:var(--teal);background:var(--teal-soft)}
  .wsug-info{flex:1;min-width:0}
  .wsug-name{font-weight:600;font-size:14px}
  .wsug.best .wsug-name{color:var(--teal-dark)}
  .wsug-why{font-size:12px;color:var(--muted)}
  .btn.mini{flex:none;padding:7px 16px;font-size:13px;border-radius:9px}
  .assigned-now{background:var(--teal-soft);color:var(--teal-dark);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;align-items:center;gap:8px}
  .assigned-now b{font-weight:700}
  .mini-btn{margin-left:auto;background:none;border:1px solid var(--teal);color:var(--teal-dark);border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .mini-btn:hover{background:var(--teal);color:#fff}
  .no-match{background:color-mix(in srgb,var(--orange) 12%,transparent);border:1px solid var(--orange);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted)}
  .no-match b{color:var(--ink)}
</style>
</head>

    <svg width="44" height="44" viewBox="0 0 100 100" style="display:block;margin:0 auto 16px" aria-hidden="true">

<script>
/* ---------------- Supabase connection ---------------- */
const SUPABASE_URL = 'https://qkgdobpazyoxesyiznus.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cjaMPpEPhe-HxUd616SSRg_ShraAso2';

/* Bookings load from the real database (starts empty, filled by loadBookings). */
let bookings = [];

/* Turn a raw database row into the shape the dashboard already renders. */
function fromDb(r){
  const sizeLabel = r.base==='sinks'
    ? `Sinks only · ${r.sink_count||'?'} sink${r.sink_count>1?'s':''}`
    : `Counters + sinks · ${r.size?r.size.charAt(0).toUpperCase()+r.size.slice(1):'—'}`;
  const names = {stovetop:'Stovetop',warming:'Warming drawer',microwave:'Microwave',oven:'Oven'};
  const addons = (r.addons||[]).map(a=>names[a]||a);
  if(r.island) addons.push(`${r.island.charAt(0).toUpperCase()+r.island.slice(1)} island`);
  return {
    id: r.id,
    name: r.customer_name || 'No name',
    market: r.market || '—',
    service: sizeLabel,
    addons,
    date: r.service_date || '',
    time: r.time_slot || '—',
    flex: r.flexibility || 'exact',
    est: r.estimate || 0,
    status: r.status || 'new',
    phone: r.phone || '',
    email: r.email || '',
    address: r.address || '',
    notes: r.notes || '',
    assignedWorkerId: r.assigned_worker_id || null,
    lat: r.lat, lng: r.lng
  };
}

/* Fetch all bookings from Supabase, newest first. */
async function loadBookings(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/bookings?select=*&order=created_at.desc`, {
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` }
    });
    if(!res.ok){ console.error('Load failed:', res.status, await res.text()); return; }
    const rows = await res.json();
    bookings = rows.map(fromDb);
    renderAll();
  }catch(err){ console.error('Load error:', err); }
}

/* ---------------- Workers + market links (for the scheduler) ---------------- */
let workersData = [];      // [{id,name,phone,has_car,availability,markets:[marketId...]}]
let marketsById = {};      // marketId -> name

async function loadWorkers(){
  try{
    const [wRes,mRes,lRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/workers?select=*`, {headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}}),
      fetch(`${SUPABASE_URL}/rest/v1/markets?select=id,name`, {headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}}),
      fetch(`${SUPABASE_URL}/rest/v1/worker_markets?select=*`, {headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}})
    ]);
    const ws = wRes.ok ? await wRes.json() : [];
    const ms = mRes.ok ? await mRes.json() : [];
    const links = lRes.ok ? await lRes.json() : [];
    marketsById = Object.fromEntries(ms.map(m=>[m.id,m.name]));
    const marketByName = Object.fromEntries(ms.map(m=>[m.name,m.id]));
    const byWorker = {};
    links.forEach(l=>{ (byWorker[l.worker_id]=byWorker[l.worker_id]||[]).push(l.market_id); });
    workersData = ws.map(w=>({
      ...w,
      markets: byWorker[w.id] || [],
      // fallback: if no explicit link, infer market from home_base text
      inferredMarket: marketByName[(w.home_base||'').trim()] || null
    }));
  }catch(err){ console.error('Load workers error:', err); }
}

/* Straight-line distance between two lat/lng points, in miles (Haversine).
   Good proxy for "who's nearby"; real drive-time is a later upgrade. */
function milesBetween(lat1,lng1,lat2,lng2){
  if(lat1==null||lng1==null||lat2==null||lng2==null) return null;
  const R=3959, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ---------------- The scheduler: rank eligible workers for a booking ----------------
   Hard rules (must pass): serves the booking's market, available that date,
   has a car, not already booked at that time.
   Ranking: NEAREST worker first (real distance from worker home → booking),
   then lightest workload as a tiebreak. */
function eligibleWorkers(b){
  const marketName = b.market;
  const date = b.date, time = b.time;
  const dayLoad = {}, busyAt = {};
  bookings.forEach(x=>{
    if(x.assignedWorkerId && x.date===date){
      dayLoad[x.assignedWorkerId] = (dayLoad[x.assignedWorkerId]||0)+1;
      if(x.time===time) busyAt[x.assignedWorkerId]=true;
    }
  });
  return workersData.map(w=>{
    const servesMarket = w.markets.some(mid=>marketsById[mid]===marketName) || (w.inferredMarket && marketsById[w.inferredMarket]===marketName);
    const avail = w.availability && w.availability[date] && w.availability[date].state && w.availability[date].state!=='none';
    const hasCar = w.has_car !== false;
    const doubleBooked = !!busyAt[w.id];
    const eligible = servesMarket && avail && hasCar && !doubleBooked && (w.status!=='inactive');
    const dist = milesBetween(w.lat, w.lng, b.lat, b.lng);   // miles, or null if no coords
    return { worker:w, eligible, servesMarket, avail, hasCar, doubleBooked, load: dayLoad[w.id]||0, dist };
  })
  .filter(r=>r.eligible)
  .sort((a,b2)=>{
    // RULE: prefer a worker who already has a job that day (so this becomes their 2nd+),
    // rather than bringing out a fresh worker for a single stop. A worker who is already
    // working AND reasonably close beats an idle worker who is only marginally closer.
    const aWorking = a.load > 0, bWorking = b2.load > 0;
    if(aWorking !== bWorking){
      // one is already working, the other isn't. Prefer the working one UNLESS the
      // idle worker is dramatically closer (>10 mi closer = worth bringing out fresh).
      const working = aWorking ? a : b2;
      const idle    = aWorking ? b2 : a;
      const idleMuchCloser = (idle.dist!=null && working.dist!=null && working.dist - idle.dist > 10);
      if(idleMuchCloser) return aWorking ? 1 : -1;   // idle wins only if much closer
      return aWorking ? -1 : 1;                        // otherwise the already-working one wins
    }
    // both working, or both idle: nearest first, then lighter workload
    if(a.dist!=null && b2.dist!=null && Math.abs(a.dist-b2.dist)>0.5) return a.dist - b2.dist;
    if(a.dist!=null && b2.dist==null) return -1;
    if(a.dist==null && b2.dist!=null) return 1;
    return a.load - b2.load || a.worker.name.localeCompare(b2.worker.name);
  });
}

/* Applications load from the real `applications` table (starts empty). */
let applications = [];

/* Turn a raw application row into the shape the dashboard renders. */
function appFromDb(r){
  return {
    id: r.id,
    name: r.full_name || 'No name',
    market: r.market || '—',
    phone: r.phone || '',
    email: r.email || '',
    car: r.has_car ? 'yes' : 'no',
    comm: r.communication || '',
    returning: r.is_returning ? 'yes' : 'no',
    years: r.prior_years || '',
    yeshiva: r.yeshiva || '',
    estHours: r.est_hours || 0,
    fullDays: r.full_days || 0,
    partDays: r.part_days || 0,
    status: r.status || 'pending',
    _raw: r    // keep the full row so we can create a worker on approval
  };
}

/* Fetch all applications from Supabase, newest first. */
async function loadApplications(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/applications?select=*&order=created_at.desc`, {
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` }
    });
    if(!res.ok){ console.error('Load applications failed:', res.status, await res.text()); return; }
    const rows = await res.json();
    applications = rows.map(appFromDb);
    renderAll();
  }catch(err){ console.error('Load applications error:', err); }
}

const STATUS_LABEL = {new:'New',needs:'Needs info',review:'Needs review',confirmed:'Confirmed',declined:'Declined',pending:'Pending',approved:'Approved'};
const ATTN_BOOKING = s => ['new','needs','review'].includes(s);

const $ = s => document.querySelector(s);
const esc = x => (x||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const initials = n => n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const fmtDate = d => d ? new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}) : 'No date';
let bkFilter='all', apFilter='all';

/* ---------------- Tiles ---------------- */
function renderTiles(){
  const attn = bookings.filter(b=>ATTN_BOOKING(b.status)).length;
  const pending = applications.filter(a=>a.status==='pending').length;
  const confirmed = bookings.filter(b=>b.status==='confirmed').length;
  const revenue = bookings.filter(b=>b.status==='confirmed').reduce((s,b)=>s+b.est,0);
  const tiles=[
    {n:bookings.length,l:'Total bookings'},
    {n:attn,l:'Bookings need action',alert:attn>0},
    {n:pending,l:'Applications pending',alert:pending>0},
    {n:confirmed,l:'Confirmed jobs'},
    {n:'$'+revenue,l:'Confirmed revenue'}
  ];
  $('#tiles').innerHTML = tiles.map(t=>`<div class="tile ${t.alert?'alert':''}"><span class="stripe"></span><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`).join('');
}

/* ---------------- Bookings list ---------------- */
function renderBookings(){
  let list = bookings.slice();
  if(bkFilter==='attn') list = list.filter(b=>ATTN_BOOKING(b.status));
  $('#bkCount').textContent = list.length;
  $('#bookings').innerHTML = list.length ? list.map(b=>`
    <div class="row" data-bk="${b.id}">
      <div class="ravatar">${initials(b.name)}</div>
      <div class="rmain">
        <div class="rtitle">${ATTN_BOOKING(b.status)?'<span class="attn"></span> ':''}${esc(b.name)}</div>
        <div class="rsub">${esc(b.market)} · ${fmtDate(b.date)} ${esc(b.time)}</div>
      </div>
      <div class="rright">
        <span class="ramt">$${b.est}</span>
        <span class="pill ${b.status}">${STATUS_LABEL[b.status]}</span>
      </div>
    </div>`).join('') : `<div class="empty">Nothing here right now.</div>`;
  $('#bookings').querySelectorAll('[data-bk]').forEach(r=>r.addEventListener('click',()=>openBooking(r.dataset.bk)));
}

/* ---------------- Applications list ---------------- */
function renderApplications(){
  let list = applications.slice();
  if(apFilter==='pending') list = list.filter(a=>a.status==='pending');
  // sort by availability (your spec: primary hiring factor) — most hours first
  list.sort((a,b)=>b.estHours-a.estHours);
  $('#apCount').textContent = list.length;
  $('#applications').innerHTML = list.length ? list.map(a=>`
    <div class="row" data-ap="${a.id}">
      <div class="ravatar app">${initials(a.name)}</div>
      <div class="rmain">
        <div class="rtitle">${esc(a.name)}</div>
        <div class="rsub">${esc(a.market)} · ${a.estHours} hrs available · ${a.car==='yes'?'has car':'no car'}</div>
      </div>
      <div class="rright">
        <span class="ramt" style="color:var(--teal)">${a.fullDays}d</span>
        <span class="pill ${a.status}">${STATUS_LABEL[a.status]}</span>
      </div>
    </div>`).join('') : `<div class="empty">No applications match this filter.</div>`;
  $('#applications').querySelectorAll('[data-ap]').forEach(r=>r.addEventListener('click',()=>openApplication(r.dataset.ap)));
}

/* ---------------- Assignment section (the scheduler UI) ---------------- */
function assignmentSection(b){
  // already assigned?
  if(b.assignedWorkerId){
    const w = workersData.find(x=>x.id===b.assignedWorkerId);
    return `<div class="assigned-now">✓ Assigned to <b>${esc(w?w.name:'a worker')}</b>
      <button class="mini-btn" onclick="unassign('${b.id}')">Change</button></div>
      <button class="btn approve mini" style="margin-top:8px;width:100%" onclick="recalcRoutes(this)">↻ Recalculate routes now</button>
      <div class="recalc-note" style="font-size:12px;color:var(--muted);margin-top:6px">After overriding an assignment, click to re-optimize the affected workers’ routes right away (instead of waiting for the next automatic pass).</div>`;
  }
  const ranked = eligibleWorkers(b);
  if(!ranked.length){
    return `<div class="no-match">No eligible worker found — no one in <b>${esc(b.market)}</b> is available ${fmtDate(b.date)} with an open slot. This is a scheduling exception to review.</div>`;
  }
  const anyAlreadyWorking = ranked.some(r=>r.load>0);
  const rows = ranked.map((r,i)=>{
    const distTxt = r.dist!=null ? `${r.dist.toFixed(1)} mi away` : 'distance unknown';
    let loadTxt;
    if(r.load>0){ loadTxt = `already has ${r.load} job${r.load>1?'s':''} nearby ✓`; }
    else if(anyAlreadyWorking){ loadTxt = `would be a fresh trip (1 job only)`; }
    else { loadTxt = `no one’s in the area yet`; }
    return `
    <div class="wsug ${i===0?'best':''}">
      <div class="wsug-info">
        <div class="wsug-name">${i===0?'★ ':''}${esc(r.worker.name)}</div>
        <div class="wsug-why">${distTxt} · ${loadTxt}</div>
      </div>
      <button class="btn approve mini" onclick="assignWorker('${b.id}','${r.worker.id}')">Assign</button>
    </div>`;
  }).join('');
  return `<div class="sug-hint">Ranked by nearest available worker. Top pick starred — you confirm.</div>${rows}`;
}

window.assignWorker = async (bookingId, workerId) => {
  const b = bookings.find(x=>x.id===bookingId);
  b.assignedWorkerId = workerId;            // update locally
  openBooking(bookingId);                    // re-render drawer to show "assigned"
  renderAll();
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/bookings?id=eq.${bookingId}`, {
      method:'PATCH',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}`, 'Prefer':'return=minimal' },
      body: JSON.stringify({ assigned_worker_id: workerId })
    });
  }catch(err){ console.error('Assign failed:', err); }
};
window.unassign = async (bookingId) => {
  const b = bookings.find(x=>x.id===bookingId);
  b.assignedWorkerId = null;
  openBooking(bookingId); renderAll();
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/bookings?id=eq.${bookingId}`, {
      method:'PATCH',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}`, 'Prefer':'return=minimal' },
      body: JSON.stringify({ assigned_worker_id: null })
    });
  }catch(err){ console.error('Unassign failed:', err); }
};

/* Manually trigger the route-optimization engine right now (after an override).
   Re-optimizes every worker-day that changed — including both workers an override touched. */
window.recalcRoutes = async (btn) => {
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = '↻ Recalculating…';
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/optimize-routes`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    btn.textContent = res.ok ? `✓ Recalculated ${data.optimized||0} route${data.optimized===1?'':'s'}` : '✕ Failed — try again';
  }catch(err){
    console.error('Recalc failed:', err); btn.textContent = '✕ Failed — try again';
  }
  setTimeout(()=>{ btn.disabled=false; btn.textContent=orig; }, 3000);
};

/* ---------------- Drawer: booking ---------------- */

  const b = bookings.find(x=>x.id===id);
  const resolved = !ATTN_BOOKING(b.status);
  $('#drawer').innerHTML = `
    <div class="dhead">
      <div class="ravatar">${initials(b.name)}</div>
      <div><h2>${esc(b.name)}</h2><div class="sub">${esc(b.market)}</div></div>
      <button class="x" onclick="closeDrawer()" aria-label="Close">✕</button>
    </div>
    <div class="dbody">
      <div class="drow"><span class="k">Status</span><span class="v"><span class="pill ${b.status}">${STATUS_LABEL[b.status]}</span></span></div>
      <div class="dsec">Service</div>
      <div class="drow"><span class="k">Package</span><span class="v">${esc(b.service)}</span></div>
      <div class="drow"><span class="k">Add-ons</span><span class="v">${b.addons.length?`<span class="chips">${b.addons.map(a=>`<span class="chip2">${esc(a)}</span>`).join('')}</span>`:'None'}</span></div>
      <div class="drow"><span class="k">Estimate</span><span class="v">$${b.est}</span></div>
      <div class="dsec">Appointment</div>
      <div class="drow"><span class="k">Date</span><span class="v">${fmtDate(b.date)}</span></div>
      <div class="drow"><span class="k">Time</span><span class="v">${esc(b.time)} · ${b.flex==='exact'?'exact':'±1 hr flexible'}</span></div>
      <div class="dsec">Worker assignment</div>
      ${assignmentSection(b)}
      <div class="dsec">Customer</div>
      <div class="drow"><span class="k">Phone</span><span class="v">${esc(b.phone)}</span></div>
      <div class="drow"><span class="k">Address</span><span class="v">${esc(b.address)}</span></div>
      ${b.notes?`<div class="drow"><span class="k">Notes</span><span class="v">${esc(b.notes)}</span></div>`:''}
    </div>
    ${resolved
      ? `<div class="resolved ${b.status==='declined'?'no':''}">${b.status==='confirmed'?'✓ Confirmed':STATUS_LABEL[b.status]}</div>`
      : `<div class="dfoot">
          <button class="btn decline" onclick="setBooking('${b.id}','declined')">Decline</button>
          ${b.status==='review'?`<button class="btn secondary" onclick="setBooking('${b.id}','needs')">Flag: needs info</button>`:''}
          <button class="btn approve" onclick="setBooking('${b.id}','confirmed')">Confirm</button>
        </div>`}`;
  openDrawer();
}
window.setBooking=async(id,status)=>{
  bookings.find(b=>b.id===id).status=status; renderAll(); closeDrawer();
  // save the status change back to the database
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/bookings?id=eq.${id}`, {
      method:'PATCH',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}`, 'Prefer':'return=minimal' },
      body: JSON.stringify({status})
    });
  }catch(err){ console.error('Status update failed:', err); }
};

/* ---------------- Drawer: application ---------------- */
function openApplication(id){
  const a = applications.find(x=>x.id===id);
  const resolved = a.status!=='pending';
  $('#drawer').innerHTML = `
    <div class="dhead">
      <div class="ravatar app">${initials(a.name)}</div>
      <div><h2>${esc(a.name)}</h2><div class="sub">Applying · ${esc(a.market)}</div></div>
      <button class="x" onclick="closeDrawer()" aria-label="Close">✕</button>
    </div>
    <div class="dbody">
      <div class="drow"><span class="k">Status</span><span class="v"><span class="pill ${a.status}">${STATUS_LABEL[a.status]}</span></span></div>
      <div class="dsec">Availability — primary hiring factor</div>
      <div class="drow"><span class="k">Estimated hours</span><span class="v" style="color:var(--teal)">${a.estHours} hrs</span></div>
      <div class="drow"><span class="k">Full days</span><span class="v">${a.fullDays}</span></div>
      <div class="drow"><span class="k">Partial days</span><span class="v">${a.partDays}</span></div>
      <div class="dsec">Details</div>
      <div class="drow"><span class="k">Phone</span><span class="v">${esc(a.phone)}</span></div>
      <div class="drow"><span class="k">Email</span><span class="v">${esc(a.email)}</span></div>
      <div class="drow"><span class="k">Has car</span><span class="v">${a.car==='yes'?'Yes':'No'}</span></div>
      <div class="drow"><span class="k">Contact via</span><span class="v">${a.comm==='whatsapp'?'WhatsApp':'SMS'}</span></div>
      <div class="drow"><span class="k">Yeshiva</span><span class="v">${esc(a.yeshiva)}</span></div>
      <div class="drow"><span class="k">Returning</span><span class="v">${a.returning==='yes'?`Yes (${esc(a.years)})`:'No'}</span></div>
    </div>
    ${resolved
      ? `<div class="resolved ${a.status==='declined'?'no':''}">${a.status==='approved'?('✓ Approved — added to '+a.market):STATUS_LABEL[a.status]}</div>`
      : `<div class="dfoot">
          <button class="btn decline" onclick="setApp('${a.id}','declined')">Decline</button>
          <button class="btn approve" onclick="setApp('${a.id}','approved')">Approve worker</button>
        </div>`}`;
  openDrawer();
}
window.setApp=async(id,status)=>{
  const app = applications.find(a=>a.id===id);
  app.status=status; renderAll(); closeDrawer();

  // 1. update the application's status in the database
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/applications?id=eq.${id}`, {
      method:'PATCH',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}`, 'Prefer':'return=minimal' },
      body: JSON.stringify({status})
    });
  }catch(err){ console.error('Application status update failed:', err); }

  // 2. if approved, create a WORKER from this application (carries availability + market)
  if(status==='approved'){
    const r = app._raw || {};
    const worker = {
      name: r.full_name,
      phone: r.phone,
      email: r.email,
      home_base: r.address || r.market,
      hourly_rate: 30,
      has_car: r.has_car,
      travel_flexibility: 'medium',
      availability: r.availability,
      status: 'active',
      application_id: r.id
    };
    try{
      const res = await fetch(`${SUPABASE_URL}/rest/v1/workers`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}`, 'Prefer':'return=representation' },
        body: JSON.stringify(worker)
      });
      if(res.ok){
        const [created] = await res.json();
        // link the worker to their market (many-to-many), if the market name matches one of ours
        if(created && r.market){
          const mRes = await fetch(`${SUPABASE_URL}/rest/v1/markets?select=id&name=eq.${encodeURIComponent(r.market)}`, {
            headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` }
          });
          const markets = mRes.ok ? await mRes.json() : [];
          if(markets[0]){
            await fetch(`${SUPABASE_URL}/rest/v1/worker_markets`, {
              method:'POST',
              headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}`, 'Prefer':'return=minimal' },
              body: JSON.stringify({ worker_id: created.id, market_id: markets[0].id })
            });
          }
        }
      } else { console.error('Create worker failed:', res.status, await res.text()); }
    }catch(err){ console.error('Create worker error:', err); }
  }
};

/* ---------------- Drawer open/close ---------------- */
function openDrawer(){ $('#scrim').classList.add('open'); $('#drawer').classList.add('open'); }
window.closeDrawer=()=>{ $('#scrim').classList.remove('open'); $('#drawer').classList.remove('open'); };
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

/* ---------------- Filters ---------------- */
$('#bkFilters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  bkFilter=b.dataset.f; $('#bkFilters').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); renderBookings();
}));
$('#apFilters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  apFilter=b.dataset.f; $('#apFilters').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); renderApplications();
}));

function renderAll(){ renderTiles(); renderBookings(); renderApplications(); }

// Dashboard data only loads AFTER a staff member is signed in (see auth gate below).
function startDashboard(){
  renderAll();          // draw immediately
  loadWorkers();        // load workers + market links (for the scheduler)
  loadBookings();       // fetch real bookings
  loadApplications();   // fetch real worker applications
}

/* theme */
$('#theme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sysDark?'light':'dark'));
});

/* ---------------- Staff login gate ----------------
   Uses Supabase Auth (email + password) via its REST endpoint — no library needed.
   The page stays hidden behind the gate until sign-in succeeds. A saved session
   (token in localStorage) lets you stay logged in across visits. */
const AUTH = `${SUPABASE_URL}/auth/v1`;
const TOKEN_KEY = 'pk_staff_token';

async function checkSession(){
  const token = localStorage.getItem(TOKEN_KEY);
  if(!token) return false;
  // validate the token by asking who we are
  const res = await fetch(`${AUTH}/user`, { headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${token}` } });
  return res.ok;
}
async function doLogin(email, password){
  const res = await fetch(`${AUTH}/token?grant_type=password`, {
    method:'POST',
    headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if(res.ok && data.access_token){
    localStorage.setItem(TOKEN_KEY, data.access_token);
    return true;
  }
  throw new Error(data.error_description || data.msg || 'Wrong email or password.');
}
function unlock(){
  document.getElementById('loginGate').style.display = 'none';
  startDashboard();
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const err = document.getElementById('loginErr');
  err.textContent = '';
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  if(!email || !pass){ err.textContent = 'Enter your email and password.'; return; }
  try{
    await doLogin(email, pass);
    unlock();
  }catch(e){ err.textContent = e.message; }
});
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginBtn').click(); });

// On load: if already signed in, skip the gate; otherwise show it.
(async ()=>{
  if(await checkSession()) unlock();
  // else the gate stays visible (it's shown by default)
})();
</script>
