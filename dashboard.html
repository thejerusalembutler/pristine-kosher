<title>Pristine Kosher — Operations Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --teal:#20A59F; --teal-dark:#178079; --teal-soft:#E3F4F2;
    --ink:#0A0A0A; --paper:#FFFFFF; --mist:#F4F6F5;
    --line:#E4E8E7; --muted:#5C6663; --orange:#F78700; --red:#D64545;
    --green:#2FA84F; --amber:#E8A400; --blue:#3B7DD8;
    --card:#FFFFFF; --card-hover:#F0FAF9; --radius:14px;
    --shadow:0 1px 2px rgba(10,10,10,.04),0 8px 24px rgba(10,10,10,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --teal:#2FBDB6; --teal-dark:#20A59F; --teal-soft:#123330;
      --ink:#F2F5F4; --paper:#0E1413; --mist:#0A0F0E;
      --line:#243230; --muted:#9AA7A4; --orange:#FF9D2E; --red:#F26D6D;
      --green:#4FC26B; --amber:#F0BE3C; --blue:#6AA3F0;
      --card:#141C1A; --card-hover:#182421;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="light"]{--teal:#20A59F;--teal-dark:#178079;--teal-soft:#E3F4F2;--ink:#0A0A0A;--paper:#FFFFFF;--mist:#F4F6F5;--line:#E4E8E7;--muted:#5C6663;--green:#2FA84F;--amber:#E8A400;--blue:#3B7DD8;--red:#D64545;--card:#FFFFFF;--card-hover:#F0FAF9}
  :root[data-theme="dark"]{--teal:#2FBDB6;--teal-dark:#20A59F;--teal-soft:#123330;--ink:#F2F5F4;--paper:#0E1413;--mist:#0A0F0E;--line:#243230;--muted:#9AA7A4;--green:#4FC26B;--amber:#F0BE3C;--blue:#6AA3F0;--red:#F26D6D;--card:#141C1A;--card-hover:#182421}

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--mist);color:var(--ink);font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}

  .top{display:flex;align-items:center;gap:14px;padding:16px 28px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:10}
  .top .mark{width:32px;height:32px;flex:none}
  .top .name{font-weight:800;letter-spacing:.12em;font-size:13px}
  .top .name span{color:var(--teal);font-weight:600}
  .top .crumb{margin-left:6px;padding-left:16px;border-left:1px solid #2a3432;font-size:13px;color:#9aa7a4}
  .top .themebtn{margin-left:auto;background:none;border:1px solid #2a3432;color:#9aa7a4;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px}
  .top .themebtn:hover{border-color:var(--teal);color:var(--teal)}

  .page{max-width:1120px;margin:0 auto;padding:24px 28px 60px}
  h1.ph{font-size:24px;font-weight:800;margin:0 0 18px}

  /* stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:26px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;position:relative}
  .tile .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .tile .l{font-size:12px;color:var(--muted);margin-top:5px}
  .tile.alert{border-color:var(--orange)}
  .tile.alert .n{color:var(--orange)}
  .tile .stripe{position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:99px;background:var(--teal)}
  .tile.alert .stripe{background:var(--orange)}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .phead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .phead h2{font-size:16px;font-weight:800;margin:0}
  .phead .count{font-size:12px;color:var(--muted);background:var(--mist);border-radius:99px;padding:2px 9px;font-weight:600}
  .filters{margin-left:auto;display:flex;gap:4px}
  .filters button{font-family:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
  .filters button.on{background:var(--teal);border-color:var(--teal);color:#fff}

  .rows{max-height:560px;overflow-y:auto}
  .row{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .1s}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--card-hover)}
  .ravatar{width:38px;height:38px;border-radius:10px;background:var(--teal-soft);color:var(--teal-dark);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .ravatar.app{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
  .rmain{flex:1;min-width:0}
  .rtitle{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rsub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rright{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .ramt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:99px;text-transform:uppercase;white-space:nowrap}
  .pill.new{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
  .pill.needs{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
  .pill.review{background:color-mix(in srgb,var(--orange) 18%,transparent);color:var(--orange)}
  .pill.confirmed,.pill.approved{background:var(--teal-soft);color:var(--teal-dark)}
  .pill.declined{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
  .pill.pending{background:var(--mist);color:var(--muted)}
  .attn{width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(10,10,10,.5);display:none;z-index:20}
  .scrim.open{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper);box-shadow:-10px 0 40px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .3s cubic-bezier(.16,1,.3,1);z-index:21;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  @media (prefers-reduced-motion:reduce){.drawer{transition:none}}
  .dhead{display:flex;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
  .dhead .ravatar{width:44px;height:44px;font-size:15px}
  .dhead h2{font-size:17px;font-weight:800;margin:0}
  .dhead .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .dhead .x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
  .dbody{padding:18px 22px;overflow-y:auto;flex:1}
  .drow{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .drow:last-child{border-bottom:none}
  .drow .k{color:var(--muted)}
  .drow .v{font-weight:600;text-align:right}
  .dsec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:18px 0 4px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
  .chip2{font-size:11.5px;background:var(--mist);border:1px solid var(--line);border-radius:7px;padding:2px 8px}
  .dfoot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
  .btn{font-family:inherit;font-weight:700;font-size:14px;border-radius:11px;cursor:pointer;padding:12px 18px;border:1.5px solid transparent;flex:1;transition:background .15s,border-color .15s,opacity .15s}
  .btn.approve{background:var(--teal);color:#fff}
  .btn.approve:hover{background:var(--teal-dark)}
  .btn.decline{background:none;color:var(--red);border-color:var(--line)}
  .btn.decline:hover{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,transparent)}
  .btn.secondary{background:none;color:var(--muted);border-color:var(--line)}
  .btn.secondary:hover{border-color:var(--muted);color:var(--ink)}
  .resolved{padding:14px 22px;background:var(--teal-soft);color:var(--teal-dark);font-size:13.5px;font-weight:600;text-align:center}
  .resolved.no{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}

  @media (max-width:820px){
    .tiles{grid-template-columns:1fr 1fr}
    .cols{grid-template-columns:1fr}
    .page{padding:18px}.top{padding:14px 18px}
  }
</style>

<div class="top">
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <rect x="8" y="14" width="40" height="72" fill="#fff"/>
    <path d="M20 30 h14 a13 13 0 0 1 0 26 h-14 z" fill="#0A0A0A"/>
    <rect x="20" y="30" width="6" height="26" fill="#0A0A0A"/>
    <path d="M50 14 h22 L46 50 L72 86 H50 L28 52 z" fill="#20A59F"/>
  </svg>
  <div class="name">PRISTINE <span>KOSHER</span></div>
  <div class="crumb">Operations dashboard</div>
  <button class="themebtn" id="theme" title="Switch light / dark" aria-label="Switch theme">◑</button>
</div>

<div class="page">
  <h1 class="ph">Today at a glance</h1>
  <div class="tiles" id="tiles"></div>

  <div class="cols">
    <!-- Bookings -->
    <div class="panel">
      <div class="phead">
        <h2>Customer bookings</h2><span class="count" id="bkCount">0</span>
        <div class="filters" id="bkFilters">
          <button data-f="all" class="on">All</button>
          <button data-f="attn">Needs action</button>
        </div>
      </div>
      <div class="rows" id="bookings"></div>
    </div>

    <!-- Applications -->
    <div class="panel">
      <div class="phead">
        <h2>Worker applications</h2><span class="count" id="apCount">0</span>
        <div class="filters" id="apFilters">
          <button data-f="all" class="on">All</button>
          <button data-f="pending">Pending</button>
        </div>
      </div>
      <div class="rows" id="applications"></div>
    </div>
  </div>
</div>

<!-- Drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Details"></aside>

<script>
/* ---------------- Demo data ---------------- */
let bookings = [
  {id:'b1',name:'Sarah Cohen',market:'Lakewood, NJ',service:'Counters + sinks · Large',addons:['Stovetop','Small island'],date:'2027-04-14',time:'9:00 AM',flex:'exact',est:380,status:'new',phone:'(732) 555-0110',address:'12 Forest Ave, Lakewood',notes:'Parking in driveway.'},
  {id:'b2',name:'Miriam Katz',market:'Five Towns, NY',service:'Counters + sinks · Standard',addons:['Microwave'],date:'2027-04-15',time:'10:30 AM',flex:'limited',est:290,status:'needs',phone:'(516) 555-0193',address:'8 Central Ave, Cedarhurst',notes:'Kitchen size unsure — sent a photo.'},
  {id:'b3',name:'Dovid Weiss',market:'North Jersey',service:'Sinks only · 2 sinks',addons:[],date:'2027-04-13',time:'2:00 PM',flex:'exact',est:155,status:'confirmed',phone:'(973) 555-0177',address:'40 Park St, Teaneck',notes:''},
  {id:'b4',name:'Rivka Green',market:'South Florida',service:'Counters + sinks · Small',addons:['Oven','Warming drawer'],date:'2027-04-16',time:'8:30 AM',flex:'limited',est:280,status:'review',phone:'(305) 555-0148',address:'Near Boca boundary — verify',notes:'Address may be outside service area — review.'},
  {id:'b5',name:'Yaakov Brody',market:'Brooklyn, NY',service:'Counters + sinks · Large',addons:['Large island','Stovetop'],date:'2027-04-17',time:'11:00 AM',flex:'exact',est:400,status:'new',phone:'(718) 555-0122',address:'1420 Ave J, Brooklyn',notes:''}
];
let applications = [
  {id:'a1',name:'Moshe Adler',market:'Lakewood',phone:'(732) 555-0200',email:'moshe.a@email.com',car:'yes',comm:'whatsapp',returning:'yes',years:'2025',yeshiva:'BMG',estHours:118,fullDays:14,partDays:2,status:'pending'},
  {id:'a2',name:'Eli Stern',market:'Five Towns',phone:'(516) 555-0231',email:'eli.stern@email.com',car:'yes',comm:'sms',returning:'no',years:'',yeshiva:'Sh’or Yoshuv',estHours:96,fullDays:11,partDays:3,status:'pending'},
  {id:'a3',name:'Shmuel Berger',market:'Baltimore',phone:'(410) 555-0175',email:'sberger@email.com',car:'no',comm:'whatsapp',returning:'no',years:'',yeshiva:'Ner Yisroel',estHours:40,fullDays:4,partDays:2,status:'pending'},
  {id:'a4',name:'Chaim Fisher',market:'Lakewood',phone:'(732) 555-0288',email:'cfisher@email.com',car:'yes',comm:'whatsapp',returning:'yes',years:'2023, 2025',yeshiva:'BMG',estHours:130,fullDays:16,partDays:0,status:'approved'}
];

const STATUS_LABEL = {new:'New',needs:'Needs info',review:'Needs review',confirmed:'Confirmed',declined:'Declined',pending:'Pending',approved:'Approved'};
const ATTN_BOOKING = s => ['new','needs','review'].includes(s);

const $ = s => document.querySelector(s);
const esc = x => (x||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const initials = n => n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const fmtDate = d => new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
let bkFilter='all', apFilter='all';

/* ---------------- Tiles ---------------- */
function renderTiles(){
  const attn = bookings.filter(b=>ATTN_BOOKING(b.status)).length;
  const pending = applications.filter(a=>a.status==='pending').length;
  const confirmed = bookings.filter(b=>b.status==='confirmed').length;
  const revenue = bookings.filter(b=>b.status==='confirmed').reduce((s,b)=>s+b.est,0);
  const tiles=[
    {n:bookings.length,l:'Total bookings'},
    {n:attn,l:'Bookings need action',alert:attn>0},
    {n:pending,l:'Applications pending',alert:pending>0},
    {n:confirmed,l:'Confirmed jobs'},
    {n:'$'+revenue,l:'Confirmed revenue'}
  ];
  $('#tiles').innerHTML = tiles.map(t=>`<div class="tile ${t.alert?'alert':''}"><span class="stripe"></span><div class="n">${t.n}</div><div class="l">${t.l}</div></div>`).join('');
}

/* ---------------- Bookings list ---------------- */
function renderBookings(){
  let list = bookings.slice();
  if(bkFilter==='attn') list = list.filter(b=>ATTN_BOOKING(b.status));
  $('#bkCount').textContent = list.length;
  $('#bookings').innerHTML = list.length ? list.map(b=>`
    <div class="row" data-bk="${b.id}">
      <div class="ravatar">${initials(b.name)}</div>
      <div class="rmain">
        <div class="rtitle">${ATTN_BOOKING(b.status)?'<span class="attn"></span> ':''}${esc(b.name)}</div>
        <div class="rsub">${esc(b.market)} · ${fmtDate(b.date)} ${esc(b.time)}</div>
      </div>
      <div class="rright">
        <span class="ramt">$${b.est}</span>
        <span class="pill ${b.status}">${STATUS_LABEL[b.status]}</span>
      </div>
    </div>`).join('') : `<div class="empty">Nothing here right now.</div>`;
  $('#bookings').querySelectorAll('[data-bk]').forEach(r=>r.addEventListener('click',()=>openBooking(r.dataset.bk)));
}

/* ---------------- Applications list ---------------- */
function renderApplications(){
  let list = applications.slice();
  if(apFilter==='pending') list = list.filter(a=>a.status==='pending');
  // sort by availability (your spec: primary hiring factor) — most hours first
  list.sort((a,b)=>b.estHours-a.estHours);
  $('#apCount').textContent = list.length;
  $('#applications').innerHTML = list.length ? list.map(a=>`
    <div class="row" data-ap="${a.id}">
      <div class="ravatar app">${initials(a.name)}</div>
      <div class="rmain">
        <div class="rtitle">${esc(a.name)}</div>
        <div class="rsub">${esc(a.market)} · ${a.estHours} hrs available · ${a.car==='yes'?'has car':'no car'}</div>
      </div>
      <div class="rright">
        <span class="ramt" style="color:var(--teal)">${a.fullDays}d</span>
        <span class="pill ${a.status}">${STATUS_LABEL[a.status]}</span>
      </div>
    </div>`).join('') : `<div class="empty">No applications match this filter.</div>`;
  $('#applications').querySelectorAll('[data-ap]').forEach(r=>r.addEventListener('click',()=>openApplication(r.dataset.ap)));
}

/* ---------------- Drawer: booking ---------------- */
function openBooking(id){
  const b = bookings.find(x=>x.id===id);
  const resolved = !ATTN_BOOKING(b.status);
  $('#drawer').innerHTML = `
    <div class="dhead">
      <div class="ravatar">${initials(b.name)}</div>
      <div><h2>${esc(b.name)}</h2><div class="sub">${esc(b.market)}</div></div>
      <button class="x" onclick="closeDrawer()" aria-label="Close">✕</button>
    </div>
    <div class="dbody">
      <div class="drow"><span class="k">Status</span><span class="v"><span class="pill ${b.status}">${STATUS_LABEL[b.status]}</span></span></div>
      <div class="dsec">Service</div>
      <div class="drow"><span class="k">Package</span><span class="v">${esc(b.service)}</span></div>
      <div class="drow"><span class="k">Add-ons</span><span class="v">${b.addons.length?`<span class="chips">${b.addons.map(a=>`<span class="chip2">${esc(a)}</span>`).join('')}</span>`:'None'}</span></div>
      <div class="drow"><span class="k">Estimate</span><span class="v">$${b.est}</span></div>
      <div class="dsec">Appointment</div>
      <div class="drow"><span class="k">Date</span><span class="v">${fmtDate(b.date)}</span></div>
      <div class="drow"><span class="k">Time</span><span class="v">${esc(b.time)} · ${b.flex==='exact'?'exact':'±1 hr flexible'}</span></div>
      <div class="dsec">Customer</div>
      <div class="drow"><span class="k">Phone</span><span class="v">${esc(b.phone)}</span></div>
      <div class="drow"><span class="k">Address</span><span class="v">${esc(b.address)}</span></div>
      ${b.notes?`<div class="drow"><span class="k">Notes</span><span class="v">${esc(b.notes)}</span></div>`:''}
    </div>
    ${resolved
      ? `<div class="resolved ${b.status==='declined'?'no':''}">${b.status==='confirmed'?'✓ Confirmed':STATUS_LABEL[b.status]}</div>`
      : `<div class="dfoot">
          <button class="btn decline" onclick="setBooking('${b.id}','declined')">Decline</button>
          ${b.status==='review'?`<button class="btn secondary" onclick="setBooking('${b.id}','needs')">Flag: needs info</button>`:''}
          <button class="btn approve" onclick="setBooking('${b.id}','confirmed')">Confirm</button>
        </div>`}`;
  openDrawer();
}
window.setBooking=(id,status)=>{ bookings.find(b=>b.id===id).status=status; renderAll(); closeDrawer(); };

/* ---------------- Drawer: application ---------------- */
function openApplication(id){
  const a = applications.find(x=>x.id===id);
  const resolved = a.status!=='pending';
  $('#drawer').innerHTML = `
    <div class="dhead">
      <div class="ravatar app">${initials(a.name)}</div>
      <div><h2>${esc(a.name)}</h2><div class="sub">Applying · ${esc(a.market)}</div></div>
      <button class="x" onclick="closeDrawer()" aria-label="Close">✕</button>
    </div>
    <div class="dbody">
      <div class="drow"><span class="k">Status</span><span class="v"><span class="pill ${a.status}">${STATUS_LABEL[a.status]}</span></span></div>
      <div class="dsec">Availability — primary hiring factor</div>
      <div class="drow"><span class="k">Estimated hours</span><span class="v" style="color:var(--teal)">${a.estHours} hrs</span></div>
      <div class="drow"><span class="k">Full days</span><span class="v">${a.fullDays}</span></div>
      <div class="drow"><span class="k">Partial days</span><span class="v">${a.partDays}</span></div>
      <div class="dsec">Details</div>
      <div class="drow"><span class="k">Phone</span><span class="v">${esc(a.phone)}</span></div>
      <div class="drow"><span class="k">Email</span><span class="v">${esc(a.email)}</span></div>
      <div class="drow"><span class="k">Has car</span><span class="v">${a.car==='yes'?'Yes':'No'}</span></div>
      <div class="drow"><span class="k">Contact via</span><span class="v">${a.comm==='whatsapp'?'WhatsApp':'SMS'}</span></div>
      <div class="drow"><span class="k">Yeshiva</span><span class="v">${esc(a.yeshiva)}</span></div>
      <div class="drow"><span class="k">Returning</span><span class="v">${a.returning==='yes'?`Yes (${esc(a.years)})`:'No'}</span></div>
    </div>
    ${resolved
      ? `<div class="resolved ${a.status==='declined'?'no':''}">${a.status==='approved'?'✓ Approved — added to '+a.market':STATUS_LABEL[a.status]}</div>`
      : `<div class="dfoot">
          <button class="btn decline" onclick="setApp('${a.id}','declined')">Decline</button>
          <button class="btn approve" onclick="setApp('${a.id}','approved')">Approve worker</button>
        </div>`}`;
  openDrawer();
}
window.setApp=(id,status)=>{ applications.find(a=>a.id===id).status=status; renderAll(); closeDrawer(); };

/* ---------------- Drawer open/close ---------------- */
function openDrawer(){ $('#scrim').classList.add('open'); $('#drawer').classList.add('open'); }
window.closeDrawer=()=>{ $('#scrim').classList.remove('open'); $('#drawer').classList.remove('open'); };
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

/* ---------------- Filters ---------------- */
$('#bkFilters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  bkFilter=b.dataset.f; $('#bkFilters').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); renderBookings();
}));
$('#apFilters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  apFilter=b.dataset.f; $('#apFilters').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); renderApplications();
}));

function renderAll(){ renderTiles(); renderBookings(); renderApplications(); }
renderAll();

/* theme */
$('#theme').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sysDark=matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', cur?(cur==='dark'?'light':'dark'):(sysDark?'light':'dark'));
});
</script>
