<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pristine Kosher — My Jobs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --teal:#20A59F; --teal-dark:#178079; --teal-soft:#E3F4F2;
    --ink:#0A0A0A; --paper:#FFFFFF; --mist:#F4F6F5;
    --line:#E4E8E7; --muted:#5C6663; --orange:#F78700; --green:#2FA84F; --red:#D64545;
    --card:#FFFFFF; --radius:14px; --shadow:0 1px 2px rgba(10,10,10,.04),0 8px 24px rgba(10,10,10,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{--teal:#2FBDB6;--teal-dark:#20A59F;--teal-soft:#123330;--ink:#F2F5F4;--paper:#0E1413;--mist:#0A0F0E;--line:#243230;--muted:#9AA7A4;--green:#4FC26B;--red:#F26D6D;--card:#141C1A}
  }
  :root[data-theme="light"]{--teal:#20A59F;--ink:#0A0A0A;--paper:#FFFFFF;--mist:#F4F6F5;--line:#E4E8E7;--muted:#5C6663;--card:#FFFFFF;--teal-soft:#E3F4F2;--green:#2FA84F}
  :root[data-theme="dark"]{--teal:#2FBDB6;--ink:#F2F5F4;--paper:#0E1413;--mist:#0A0F0E;--line:#243230;--muted:#9AA7A4;--card:#141C1A;--teal-soft:#123330;--green:#4FC26B}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--mist);color:var(--ink);font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}

  .top{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--ink);color:#fff}
  .top .mark{width:30px;height:30px}
  .top .name{font-weight:800;letter-spacing:.12em;font-size:13px}
  .top .name span{color:var(--teal)}

  .page{max-width:560px;margin:0 auto;padding:18px 16px 60px}
  .pick{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .pick select,.pick input{flex:1;min-width:130px;font-family:inherit;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:inherit}
  .pick select:focus,.pick input:focus{outline:none;border-color:var(--teal)}

  .daysum{background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
  .daysum .l{font-size:12px;color:#9aa7a4;letter-spacing:.06em;text-transform:uppercase}
  .daysum .v{font-size:20px;font-weight:800}

  .job{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
  .job.done{opacity:.65}
  .jhead{padding:16px 18px;border-bottom:1px solid var(--line)}
  .jtime{display:inline-block;background:var(--teal-soft);color:var(--teal-dark);font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
  .jname{font-size:18px;font-weight:800}
  .jservice{font-size:13.5px;color:var(--muted);margin-top:2px}
  .jrows{padding:14px 18px;display:grid;gap:9px}
  .jrow{display:flex;gap:10px;font-size:14.5px;align-items:flex-start}
  .jrow .ic{width:20px;flex:none;text-align:center}
  .jrow a{color:var(--teal-dark);text-decoration:none;font-weight:600}
  .jrow .owed{font-weight:800;color:var(--ink)}
  .jrow .owed.big{font-size:17px}

  .arrival{padding:14px 18px;border-top:1px solid var(--line)}
  .arrgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
  .arrbtn{font-family:inherit;font-size:12.5px;font-weight:600;padding:11px 4px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:inherit;cursor:pointer;transition:border-color .12s,background .12s}
  .arrbtn:hover{border-color:var(--teal)}
  .arrbtn.sel{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-dark)}
  .jaction{padding:16px 18px;border-top:1px solid var(--line);background:var(--mist)}
  .paylabel{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:9px}
  .paygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .paybtn{font-family:inherit;font-size:14px;font-weight:600;padding:12px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);color:inherit;cursor:pointer;text-align:center;transition:border-color .12s,background .12s}
  .paybtn:hover{border-color:var(--teal)}
  .paybtn.sel{background:var(--teal);border-color:var(--teal);color:#fff}
  .paybtn.cc{grid-column:1/-1}
  .paybtn.unpaid{grid-column:1/-1;border-style:dashed}
  .paybtn.unpaid.sel{background:var(--orange);border-color:var(--orange)}
  .donebtn{width:100%;font-family:inherit;font-weight:800;font-size:16px;padding:15px;border:none;border-radius:12px;background:var(--green);color:#fff;cursor:pointer}
  .donebtn:disabled{opacity:.4;cursor:not-allowed}
  .donebadge{width:100%;text-align:center;background:var(--teal-soft);color:var(--teal-dark);font-weight:700;padding:13px;border-radius:11px;font-size:14.5px}
  .donebadge button{background:none;border:none;color:var(--teal-dark);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:13px;margin-left:8px}

  .msg{text-align:center;color:var(--muted);padding:40px 20px;font-size:14.5px}
  .msg.err{color:var(--orange)}
</style>
</head>
<body>

<div class="top">
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <rect x="8" y="14" width="40" height="72" fill="#fff"/>
    <path d="M20 30 h14 a13 13 0 0 1 0 26 h-14 z" fill="#0A0A0A"/>
    <rect x="20" y="30" width="6" height="26" fill="#0A0A0A"/>
    <path d="M50 14 h22 L46 50 L72 86 H50 L28 52 z" fill="#20A59F"/>
  </svg>
  <div class="name">PRISTINE <span>KOSHER</span></div>
  <div id="whoami" style="margin-left:auto;font-size:13px;color:#9aa7a4"></div>
  <button id="logout" style="margin-left:12px;background:none;border:1px solid #2a3432;color:#9aa7a4;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit">Sign out</button>
</div>

<div class="page">
  <div class="pick">
    <input type="date" id="date" value="2027-04-14">
  </div>
  <div id="daysum"></div>
  <div id="jobs"><div class="msg">Pick a date to see your jobs.</div></div>
</div>

<!-- Worker login gate -->
<div id="wLogin" style="position:fixed;inset:0;z-index:100;background:#0A0A0A;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:16px;padding:32px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <svg width="44" height="44" viewBox="0 0 100 100" style="display:block;margin:0 auto 16px">
      <rect x="8" y="14" width="40" height="72" fill="#0A0A0A"/><path d="M20 30 h14 a13 13 0 0 1 0 26 h-14 z" fill="#fff"/>
      <rect x="20" y="30" width="6" height="26" fill="#fff"/><path d="M50 14 h22 L46 50 L72 86 H50 L28 52 z" fill="#20A59F"/>
    </svg>
    <h2 style="text-align:center;margin:0 0 4px;font-size:19px;color:#0A0A0A">Worker sign-in</h2>
    <p style="text-align:center;color:#5C6663;font-size:13px;margin:0 0 20px">See your jobs for the day</p>
    <input id="wEmail" type="email" placeholder="Email" autocomplete="username" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid #E4E8E7;border-radius:10px;font-size:15px;margin-bottom:10px;color:#0A0A0A">
    <input id="wPass" type="password" placeholder="Password" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid #E4E8E7;border-radius:10px;font-size:15px;margin-bottom:14px;color:#0A0A0A">
    <button id="wBtn" style="width:100%;padding:13px;background:#20A59F;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">Sign in</button>
    <div id="wErr" style="color:#D64545;font-size:13px;text-align:center;margin-top:12px;min-height:18px"></div>
  </div>
</div>

<script>
const SUPABASE_URL='https://qkgdobpazyoxesyiznus.supabase.co';
const SUPABASE_KEY='sb_publishable_cjaMPpEPhe-HxUd616SSRg_ShraAso2';
const AUTH=`${SUPABASE_URL}/auth/v1`;
const WTOKEN='pk_worker_token';
// requests carry the logged-in worker's token so the database returns only their jobs
function wtoken(){ return localStorage.getItem(WTOKEN); }
function H(){ return {apikey:SUPABASE_KEY, Authorization:`Bearer ${wtoken()||SUPABASE_KEY}`}; }
let me=null;   // the logged-in worker's record {id,name}
const $=s=>document.querySelector(s);
const esc=x=>(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let workers=[], jobs=[];

const PAY={zelle:'Zelle',cash:'Cash',check:'Check',cc_office:'Credit card (call office)',unpaid:'Unpaid'};
const ARR={omw:'On my way',ontime:'On time',late15:'15 min late'};
// the actual message texted to the customer
function arrivalMessage(key,customer){
  const first=(customer||'').split(' ')[0]||'there';
  const msgs={
    omw:`Hi ${first}, this is your Pristine Kosher technician — I’m on my way to you now.`,
    ontime:`Hi ${first}, this is Pristine Kosher — confirming I’ll be there on time for your appointment.`,
    late15:`Hi ${first}, this is Pristine Kosher — I’m running about 15 minutes late, thank you for your patience.`
  };
  return msgs[key]||'';
}
function fmt12(t){ if(!t) return ''; let [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; let hh=h%12||12; return `${hh}:${String(m).padStart(2,'0')} ${ap}`; }
function serviceLabel(b){
  if(b.base==='sinks') return `Sinks only · ${b.sink_count||'?'} sink${b.sink_count>1?'s':''}`;
  let s=`Counters · ${b.size?b.size[0].toUpperCase()+b.size.slice(1):'—'}`;
  const names={stovetop:'Stovetop',warming:'Warming drawer',microwave:'Microwave',oven:'Oven'};
  const extras=(b.addons||[]).map(a=>names[a]||a);
  if(b.island) extras.push(`${b.island[0].toUpperCase()+b.island.slice(1)} island`);
  return extras.length ? `${s} + ${extras.join(', ')}` : s;
}

// Identify the logged-in worker: find the worker record linked to this login.
async function identifyMe(){
  const uRes=await fetch(`${AUTH}/user`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${wtoken()}`}});
  if(!uRes.ok) return false;
  const user=await uRes.json();
  // find their worker record (RLS lets a worker read only their own row)
  const wRes=await fetch(`${SUPABASE_URL}/rest/v1/workers?select=id,name&user_id=eq.${user.id}`,{headers:H()});
  const rows=wRes.ok?await wRes.json():[];
  if(!rows.length) return false;
  me=rows[0];
  $('#whoami').textContent=me.name;
  return true;
}

async function loadJobs(){
  if(!me){ return; }
  const date=$('#date').value;
  const url=`${SUPABASE_URL}/rest/v1/bookings?select=*&assigned_worker_id=eq.${me.id}&service_date=eq.${date}&order=time_slot.asc`;
  const r=await fetch(url,{headers:H()});
  jobs=r.ok?await r.json():[];
  render();
}

function render(){
  if(!jobs.length){ $('#jobs').innerHTML='<div class="msg">No jobs assigned to you on this date.</div>'; $('#daysum').innerHTML=''; return; }
  const doneCount=jobs.filter(j=>j.completed).length;
  const owed=jobs.filter(j=>!j.completed || j.payment_method==='unpaid').reduce((s,j)=>s+(j.estimate||0),0);
  $('#daysum').innerHTML=`<div class="daysum"><div><div class="l">Today</div><div class="v">${jobs.length} jobs</div></div>
    <div style="text-align:center"><div class="l">Done</div><div class="v">${doneCount}/${jobs.length}</div></div>
    <div style="text-align:right"><div class="l">Left to collect</div><div class="v">$${owed}</div></div></div>`;

  $('#jobs').innerHTML=jobs.map(j=>{
    const digits=(j.phone||'').replace(/[^0-9]/g,'');
    if(j.completed){
      return `<div class="job done">
        <div class="jhead"><span class="jtime">${fmt12(j.time_slot)}</span><div class="jname">${esc(j.customer_name)}</div>
          <div class="jservice">${esc(serviceLabel(j))}</div></div>
        <div class="jaction"><div class="donebadge">✓ Done · Paid: ${esc(PAY[j.payment_method]||'—')}
          <button data-undo="${j.id}">undo</button></div></div></div>`;
    }
    return `<div class="job" data-job="${j.id}">
      <div class="jhead"><span class="jtime">${fmt12(j.time_slot)}</span><div class="jname">${esc(j.customer_name)}</div>
        <div class="jservice">${esc(serviceLabel(j))}</div></div>
      <div class="jrows">
        <div class="jrow"><span class="ic">📍</span><span>${esc(j.address||j.market||'')}</span></div>
        <div class="jrow"><span class="ic">📞</span><span>${j.phone?`<a href="tel:${digits}">${esc(j.phone)}</a>`:'—'}</span></div>
        <div class="jrow"><span class="ic">💵</span><span class="owed big">$${j.estimate||0} <span style="font-weight:400;color:var(--muted);font-size:13px">to collect</span></span></div>
        ${j.notes?`<div class="jrow"><span class="ic">📝</span><span>${esc(j.notes)}</span></div>`:''}
      </div>
      <div class="arrival">
        <div class="paylabel">Tell the customer${j.arrival_status?` · last: ${esc(ARR[j.arrival_status]||'')}`:''}</div>
        <div class="arrgrid">
          <button class="arrbtn" data-arr="omw" data-id="${j.id}">🚗 On my way</button>
          <button class="arrbtn" data-arr="ontime" data-id="${j.id}">👍 On time</button>
          <button class="arrbtn" data-arr="late15" data-id="${j.id}">⏱ 15 min late</button>
        </div>
      </div>
      <div class="jaction">
        <div class="paylabel">How did they pay?</div>
        <div class="paygrid">
          <button class="paybtn" data-pay="zelle" data-id="${j.id}">Zelle</button>
          <button class="paybtn" data-pay="cash" data-id="${j.id}">Cash</button>
          <button class="paybtn" data-pay="check" data-id="${j.id}">Check</button>
          <button class="paybtn" data-pay="cc_office" data-id="${j.id}">Credit card<br><small>(they call office)</small></button>
          <button class="paybtn unpaid" data-pay="unpaid" data-id="${j.id}">Didn’t pay — office follow-up</button>
        </div>
        <button class="donebtn" data-done="${j.id}" disabled>Select payment, then mark done</button>
      </div></div>`;
  }).join('');

  // wire payment selection
  document.querySelectorAll('.paybtn').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.id, card=b.closest('.job');
    card.querySelectorAll('.paybtn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    card._pay=b.dataset.pay;
    const done=card.querySelector('.donebtn');
    done.disabled=false; done.textContent='✓ Mark done — paid '+ (PAY[b.dataset.pay]||'');
  }));
  document.querySelectorAll('.donebtn').forEach(b=>b.addEventListener('click',()=>markDone(b.dataset.done,b.closest('.job')._pay)));
  document.querySelectorAll('[data-undo]').forEach(b=>b.addEventListener('click',()=>undo(b.dataset.undo)));

  // arrival-status: record it + open the phone's SMS app pre-filled to the customer
  document.querySelectorAll('.arrbtn').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.id, key=b.dataset.arr;
    const job=jobs.find(j=>j.id===id);
    const card=b.closest('.job');
    card.querySelectorAll('.arrbtn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    // save the status
    fetch(`${SUPABASE_URL}/rest/v1/bookings?id=eq.${id}`,{method:'PATCH',
      headers:{...H(),'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({arrival_status:key,arrival_status_at:new Date().toISOString()})});
    // open native SMS app pre-filled (works today, before Twilio automation)
    const digits=(job.phone||'').replace(/[^0-9]/g,'');
    const msg=encodeURIComponent(arrivalMessage(key,job.customer_name));
    if(digits){ window.location.href=`sms:${digits}?&body=${msg}`; }
    else { alert('No phone number on this booking — can’t text.'); }
  }));
}

async function markDone(id,pay){
  const body={completed:true,completed_at:new Date().toISOString(),payment_method:pay,
    payment_note:(pay==='unpaid'?'office follow-up':''),status:'confirmed'};
  await fetch(`${SUPABASE_URL}/rest/v1/bookings?id=eq.${id}`,{method:'PATCH',
    headers:{...H(),'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});
  loadJobs();
}
async function undo(id){
  await fetch(`${SUPABASE_URL}/rest/v1/bookings?id=eq.${id}`,{method:'PATCH',
    headers:{...H(),'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({completed:false,completed_at:null,payment_method:null})});
  loadJobs();
}

$('#date').addEventListener('change',loadJobs);

/* ---------------- Worker login flow ---------------- */
async function workerLogin(email, password){
  const res=await fetch(`${AUTH}/token?grant_type=password`,{
    method:'POST', headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  });
  const d=await res.json();
  if(res.ok && d.access_token){ localStorage.setItem(WTOKEN,d.access_token); return true; }
  throw new Error(d.error_description||d.msg||'Wrong email or password.');
}
async function startWorker(){
  const ok=await identifyMe();
  if(!ok){
    // logged in but no linked worker record — show a clear message
    localStorage.removeItem(WTOKEN);
    $('#wErr').textContent='This login isn’t linked to a worker yet. Contact the office.';
    return;
  }
  $('#wLogin').style.display='none';
  loadJobs();
}
$('#wBtn').addEventListener('click', async ()=>{
  $('#wErr').textContent='';
  const e=$('#wEmail').value.trim(), p=$('#wPass').value;
  if(!e||!p){ $('#wErr').textContent='Enter your email and password.'; return; }
  try{ await workerLogin(e,p); await startWorker(); }
  catch(ex){ $('#wErr').textContent=ex.message; }
});
$('#wPass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#wBtn').click(); });
$('#logout').addEventListener('click',()=>{ localStorage.removeItem(WTOKEN); location.reload(); });

// On load: if already signed in as a worker, skip the gate.
(async ()=>{ if(wtoken()) await startWorker(); })();
</script>
</body>
</html>
