<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pristine Kosher — Set Your Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;min-height:100vh;background:#0A0A0A;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Poppins,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  .card{background:#fff;border-radius:16px;padding:32px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  svg{display:block;margin:0 auto 16px}
  h2{text-align:center;margin:0 0 4px;font-size:20px;color:#0A0A0A}
  p{text-align:center;color:#5C6663;font-size:13.5px;margin:0 0 20px}
  input{width:100%;box-sizing:border-box;padding:13px 14px;border:1.5px solid #E4E8E7;border-radius:10px;font-size:15px;margin-bottom:12px;color:#0A0A0A;font-family:inherit}
  input:focus{outline:none;border-color:#20A59F}
  button{width:100%;padding:14px;background:#20A59F;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  button:hover{background:#178079}
  button:disabled{opacity:.5}
  .msg{text-align:center;font-size:13.5px;margin-top:14px;min-height:18px}
  .msg.err{color:#D64545}
  .msg.ok{color:#2FA84F}
</style>
</head>
<body>
  <div class="card">
    <img src="logo/pk-logo.jpg" alt="Pristine Kosher" style="display:block;margin:0 auto 16px;width:140px;height:auto">
    <h2>Welcome to Pristine Kosher</h2>
    <p>Set a password to access your jobs.</p>
    <input id="p1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password">
    <input id="p2" type="password" placeholder="Confirm password" autocomplete="new-password">
    <button id="btn">Set password</button>
    <div class="msg" id="msg"></div>
  </div>

<script>
const SUPABASE_URL='https://qkgdobpazyoxesyiznus.supabase.co';
const SUPABASE_KEY='sb_publishable_cjaMPpEPhe-HxUd616SSRg_ShraAso2';
const $=s=>document.querySelector(s);

// The invite link puts an access token in the URL hash — capture it.
function tokenFromHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  return h.get('access_token');
}

$('#btn').addEventListener('click', async ()=>{
  const msg=$('#msg'); msg.className='msg'; msg.textContent='';
  const p1=$('#p1').value, p2=$('#p2').value;
  if(p1.length<8){ msg.className='msg err'; msg.textContent='Password must be at least 8 characters.'; return; }
  if(p1!==p2){ msg.className='msg err'; msg.textContent='Passwords don’t match.'; return; }
  const token=tokenFromHash();
  if(!token){ msg.className='msg err'; msg.textContent='This link is invalid or expired. Ask the office to re-invite you.'; return; }

  $('#btn').disabled=true;
  try{
    const res=await fetch(`${SUPABASE_URL}/auth/v1/user`,{
      method:'PUT',
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${token}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ password: p1 })
    });
    if(res.ok){
      msg.className='msg ok'; msg.textContent='✓ Password set! Redirecting to your jobs…';
      localStorage.setItem('pk_worker_token', token);
      setTimeout(()=>location.href='worker.html', 1500);
    } else {
      const d=await res.json();
      msg.className='msg err'; msg.textContent=d.error_description||d.msg||'Could not set password.';
      $('#btn').disabled=false;
    }
  }catch(e){ msg.className='msg err'; msg.textContent='Something went wrong. Try again.'; $('#btn').disabled=false; }
});
</script>
</body>
</html>
